# L1 array blocks for arduino:cpp.

id: builtin_cpp_arrays
category: "Arrays"
implementations:
  - runtime: "arduino:cpp"
    blocks:
      # --- array_get ---
      - blockly:
          type: array_get
          message0: "%1 [ %2 ]"
          args0:
            - type: field_variable
              name: VAR
              variable: "arr"
            - type: input_value
              name: INDEX
          inputsInline: true
          output: null
          colour: "#5CA6A6"
          tooltip: "Get an element from an array by index."
        codegen:
          body:
            - "{{VAR}}[{{INDEX}}]"
          precedence: ATOMIC
          inputDefaults:
            INDEX: "0"

      # --- array_set ---
      - blockly:
          type: array_set
          message0: "%1 [ %2 ] = %3"
          args0:
            - type: field_variable
              name: VAR
              variable: "arr"
            - type: input_value
              name: INDEX
            - type: input_value
              name: VALUE
          inputsInline: true
          previousStatement: null
          nextStatement: null
          colour: "#5CA6A6"
          tooltip: "Set an element in an array by index."
        codegen:
          body:
            - "{{VAR}}[{{INDEX}}] = {{VALUE}};"
          inputDefaults:
            INDEX: "0"
            VALUE: "0"
