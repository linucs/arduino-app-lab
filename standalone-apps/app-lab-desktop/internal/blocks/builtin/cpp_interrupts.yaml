id: builtin_interrupts
category: "Input / Output::Advanced"
implementations:
  - runtime: "arduino:cpp"
    blocks:
      # --- interrupts (enable global interrupts) ---
      - blockly:
          type: cpp_interrupts_enable
          message0: "interrupts (enable)"
          args0: []
          previousStatement: null
          nextStatement: null
          tooltip: "Re-enable interrupts after noInterrupts(). Use to close a critical section."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/interrupts/interrupts/"
        codegen:
          body:
            - "interrupts();"

      # --- noInterrupts (disable global interrupts) ---
      - blockly:
          type: cpp_interrupts_disable
          message0: "noInterrupts (disable)"
          args0: []
          previousStatement: null
          nextStatement: null
          tooltip: "Disable interrupts. Use at the start of a critical section."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/interrupts/nointerrupts/"
        codegen:
          body:
            - "noInterrupts();"

      # --- attachInterrupt hat (declarative ISR + flag polling pattern) ---
      # declarations are content-hashed: two hat blocks on different pins
      # produce separate _isr_flag_N declarations and _isr_pinN functions.
      - blockly:
          type: cpp_attach_interrupt
          message0: "when pin %1 %2"
          args0:
            - type: field_number
              name: PIN
              value: 2
              min: 0
              max: 53
            - type: field_dropdown
              name: MODE
              options:
                - ["RISING", "RISING"]
                - ["FALLING", "FALLING"]
                - ["CHANGE", "CHANGE"]
          message1: "do %1"
          args1:
            - type: input_statement
              name: BODY
          nextStatement: null
          extensions:
            - hat_event_style
          tooltip: "Run the attached code whenever the pin changes to the selected state."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/external-interrupts/attachinterrupt/"
        codegen:
          declarations:
            - "volatile bool _isr_flag_{{PIN}} = false;"
            - "void _isr_pin{{PIN}}() {\n  _isr_flag_{{PIN}} = true;\n}"
          setup:
            - "attachInterrupt(digitalPinToInterrupt({{PIN}}), _isr_pin{{PIN}}, {{MODE}});"
          body:
            - "if (_isr_flag_{{PIN}}) {"
            - "  _isr_flag_{{PIN}} = false;"
            - "{{BODY}}"
            - "}"

      # --- detachInterrupt ---
      - blockly:
          type: cpp_detach_interrupt
          message0: "detachInterrupt pin %1"
          args0:
            - type: field_number
              name: PIN
              value: 2
              min: 0
              max: 53
          previousStatement: null
          nextStatement: null
          tooltip: "Turn off the interrupt on the given pin."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/external-interrupts/detachinterrupt/"
        codegen:
          body:
            - "detachInterrupt(digitalPinToInterrupt({{PIN}}));"
