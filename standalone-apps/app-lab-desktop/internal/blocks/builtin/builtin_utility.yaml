id: builtin_utility
displayName: Control
category: "Control"
implementations:
  - runtime: "arduino:cpp"
    blocks:
      # --- Onboard RGB LED (MCU-side, LED 3/4, active-LOW) ---
      # Dropdown option values ARE the code tokens — no runtime conditional.
      # Active-LOW: ON=LOW (pin driven low = LED on), OFF=HIGH (pin high = off).
      - blockly:
          type: cpp_led
          message0: "set LED %1  R %2  G %3  B %4"
          args0:
            - type: field_dropdown
              name: LED
              options:
                - ["3", "3"]
                - ["4", "4"]
            - type: field_dropdown
              name: R
              options:
                - ["ON", "LOW"]
                - ["OFF", "HIGH"]
            - type: field_dropdown
              name: G
              options:
                - ["ON", "LOW"]
                - ["OFF", "HIGH"]
            - type: field_dropdown
              name: B
              options:
                - ["ON", "LOW"]
                - ["OFF", "HIGH"]
          previousStatement: null
          nextStatement: null
          tooltip: "Set the R / G / B channels of an MCU-side onboard RGB LED (3 or 4)."
        codegen:
          setup:
            - "pinMode(LED{{LED}}_R, OUTPUT);"
            - "pinMode(LED{{LED}}_G, OUTPUT);"
            - "pinMode(LED{{LED}}_B, OUTPUT);"
            - "digitalWrite(LED{{LED}}_R, HIGH);"
            - "digitalWrite(LED{{LED}}_G, HIGH);"
            - "digitalWrite(LED{{LED}}_B, HIGH);"
          body:
            - "digitalWrite(LED{{LED}}_R, {{R}});"
            - "digitalWrite(LED{{LED}}_G, {{G}});"
            - "digitalWrite(LED{{LED}}_B, {{B}});"

      # --- delay (cpp_wait — iteration 3 name preserved) ---
      - blockly:
          type: cpp_wait
          message0: "wait %1 ms"
          args0:
            - type: input_value
              name: DURATION
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Pause execution for the given number of milliseconds."
          inputsInline: true
        codegen:
          body:
            - "delay({{DURATION}});"
          inputDefaults:
            DURATION: "1000"

      # --- millis ---
      - blockly:
          type: cpp_millis
          message0: "millis"
          args0: []
          output: Number
          tooltip: "Return the number of milliseconds since the board started."
        codegen:
          body:
            - "millis()"
          precedence: ATOMIC

      # --- micros ---
      - blockly:
          type: cpp_micros
          message0: "micros"
          args0: []
          output: Number
          tooltip: "Return the number of microseconds since the board started."
        codegen:
          body:
            - "micros()"
          precedence: ATOMIC

      # --- delayMicroseconds ---
      - blockly:
          type: cpp_delay_microseconds
          message0: "wait %1 µs"
          args0:
            - type: input_value
              name: US
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Pause execution for the given number of microseconds."
          inputsInline: true
        codegen:
          body:
            - "delayMicroseconds({{US}});"
          inputDefaults:
            US: "100"

  - runtime: "arduino:python"
    blocks:
      # --- Onboard RGB LED (CPU-side, LED 1/2) ---
      # Dropdown option values ARE the Python boolean tokens (True/False).
      - blockly:
          type: python_led
          message0: "set LED %1  R %2  G %3  B %4"
          args0:
            - type: field_dropdown
              name: LED
              options:
                - ["1", "1"]
                - ["2", "2"]
            - type: field_dropdown
              name: R
              options:
                - ["ON", "True"]
                - ["OFF", "False"]
            - type: field_dropdown
              name: G
              options:
                - ["ON", "True"]
                - ["OFF", "False"]
            - type: field_dropdown
              name: B
              options:
                - ["ON", "True"]
                - ["OFF", "False"]
          previousStatement: null
          nextStatement: null
          tooltip: "Set the R / G / B channels of a CPU-side onboard RGB LED (1 or 2)."
        codegen:
          imports:
            - "from arduino.app_utils import Leds"
          body:
            - "Leds.set_led{{LED}}_color({{R}}, {{G}}, {{B}})"

      # --- python delay (python_wait — iteration 3 name preserved) ---
      # Explicit parens around {{DURATION}} ensure correct precedence when
      # the input is a complex expression like `a + b`.
      - blockly:
          type: python_wait
          message0: "wait %1 ms"
          args0:
            - type: input_value
              name: DURATION
              check: Number
          previousStatement: null
          nextStatement: null
          tooltip: "Pause execution for the given number of milliseconds."
          inputsInline: true
        codegen:
          imports:
            - "import time"
          body:
            - "time.sleep(({{DURATION}}) / 1000)"
          inputDefaults:
            DURATION: "1000"
