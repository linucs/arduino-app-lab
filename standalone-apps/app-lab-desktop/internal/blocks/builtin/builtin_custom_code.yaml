id: builtin_custom_code
category: "Control"
implementations:
  - runtime: "arduino:cpp"
    blocks:
      - blockly:
          type: custom_code
          message0: "custom code %1"
          args0:
            - type: field_code
              name: CODE
              text: "// your code here"
          previousStatement: null
          nextStatement: null
          colour: "#5C81A6"
          tooltip: "Insert custom C++ code. Place inside a section container to target includes, global declarations, or setup."
        codegen:
          body:
            - "{{CODE}}"

  - runtime: "arduino:python"
    blocks:
      - blockly:
          type: custom_code
          message0: "custom code %1"
          args0:
            - type: field_code
              name: CODE
              text: "# your code here"
          previousStatement: null
          nextStatement: null
          colour: "#5C81A6"
          tooltip: "Insert Python custom code. Place inside a section container to target imports, global declarations, or setup."
        codegen:
          body:
            - "{{CODE}}"
