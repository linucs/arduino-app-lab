id: builtin_wire
category: "Messaging::Wire"
docs:
  library: "https://www.arduino.cc/reference/en/language/functions/communication/wire/"
implementations:
  - runtime: "arduino:cpp"
    codegen:
      imports:
        - "#include <Wire.h>"
    blocks:
      # --- Wire.begin (place inside Setup container) ---
      - blockly:
          type: cpp_wire_begin
          message0: "Wire.begin"
          args0: []
          previousStatement: null
          nextStatement: null
          tooltip: "Initialize the I2C bus as a controller. Place inside the Setup container."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/begin/"
        codegen:
          body:
            - "Wire.begin();"

      # --- Wire.requestFrom ---
      - blockly:
          type: cpp_wire_request_from
          message0: "Wire.requestFrom address %1 count %2"
          args0:
            - type: input_value
              name: ADDRESS
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: input_value
              name: COUNT
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Request bytes from a peripheral I2C device."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/requestfrom/"
          inputsInline: true
        codegen:
          body:
            - "Wire.requestFrom({{ADDRESS}}, {{COUNT}});"
          inputDefaults:
            ADDRESS: "0x20"
            COUNT: "1"

      # --- Wire.beginTransmission ---
      - blockly:
          type: cpp_wire_begin_transmission
          message0: "Wire.beginTransmission %1"
          args0:
            - type: input_value
              name: ADDRESS
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Begin a transmission to the I2C peripheral at the given address."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/begintransmission/"
          inputsInline: true
        codegen:
          body:
            - "Wire.beginTransmission({{ADDRESS}});"
          inputDefaults:
            ADDRESS: "0x20"

      # --- Wire.write ---
      - blockly:
          type: cpp_wire_write
          message0: "Wire.write %1"
          args0:
            - type: input_value
              name: VALUE
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t", "String"]
          previousStatement: null
          nextStatement: null
          tooltip: "Queue a byte for transmission to a peripheral."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/write/"
          inputsInline: true
        codegen:
          body:
            - "Wire.write({{VALUE}});"
          inputDefaults:
            VALUE: "0"

      # --- Wire.endTransmission ---
      - blockly:
          type: cpp_wire_end_transmission
          message0: "Wire.endTransmission"
          args0: []
          output: Number
          tooltip: "Send the queued bytes. Returns 0 on success."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/endtransmission/"
        codegen:
          body:
            - "Wire.endTransmission()"
          precedence: ATOMIC

      # --- Wire.read ---
      - blockly:
          type: cpp_wire_read
          message0: "Wire.read"
          args0: []
          output: Number
          tooltip: "Read one byte from the I2C receive buffer."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/read/"
        codegen:
          body:
            - "Wire.read()"
          precedence: ATOMIC

      # --- Wire.available ---
      - blockly:
          type: cpp_wire_available
          message0: "Wire.available"
          args0: []
          output: Number
          tooltip: "Return the number of bytes available in the I2C receive buffer."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/communication/wire/available/"
        codegen:
          body:
            - "Wire.available()"
          precedence: ATOMIC
