id: builtin_spi
displayName: SPI
category: "Messaging::SPI"
implementations:
  - runtime: "arduino:cpp"
    codegen:
      imports:
        - "#include <SPI.h>"
    blocks:
      # --- SPI.begin (setup-only) ---
      - blockly:
          type: cpp_spi_begin
          message0: "SPI.begin"
          args0: []
          previousStatement: null
          nextStatement: null
          tooltip: "Initialize the SPI bus. Place in setup."
        codegen:
          setup:
            - "SPI.begin();"

      # --- SPI.beginTransaction ---
      - blockly:
          type: cpp_spi_settings
          message0: "SPI.beginTransaction speed %1 %2 %3"
          args0:
            - type: input_value
              name: SPEED
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: field_dropdown
              name: BIT_ORDER
              options:
                - ["MSBFIRST", "MSBFIRST"]
                - ["LSBFIRST", "LSBFIRST"]
            - type: field_dropdown
              name: MODE
              options:
                - ["SPI_MODE0", "SPI_MODE0"]
                - ["SPI_MODE1", "SPI_MODE1"]
                - ["SPI_MODE2", "SPI_MODE2"]
                - ["SPI_MODE3", "SPI_MODE3"]
          previousStatement: null
          nextStatement: null
          tooltip: "Configure and begin an SPI transaction."
          inputsInline: true
        codegen:
          body:
            - "SPI.beginTransaction(SPISettings({{SPEED}}, {{BIT_ORDER}}, {{MODE}}));"
          inputDefaults:
            SPEED: "1000000"

      # --- SPI.transfer ---
      - blockly:
          type: cpp_spi_transfer
          message0: "SPI.transfer %1"
          args0:
            - type: input_value
              name: VALUE
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          output: Number
          tooltip: "Send and receive one byte over SPI."
          inputsInline: true
        codegen:
          body:
            - "SPI.transfer({{VALUE}})"
          precedence: ATOMIC
          inputDefaults:
            VALUE: "0"

      # --- SPI.endTransaction ---
      - blockly:
          type: cpp_spi_end_transaction
          message0: "SPI.endTransaction"
          args0: []
          previousStatement: null
          nextStatement: null
          tooltip: "End an SPI transaction."
        codegen:
          body:
            - "SPI.endTransaction();"

      # --- SPI.end ---
      - blockly:
          type: cpp_spi_end
          message0: "SPI.end"
          args0: []
          previousStatement: null
          nextStatement: null
          tooltip: "Disable the SPI bus."
        codegen:
          body:
            - "SPI.end();"
