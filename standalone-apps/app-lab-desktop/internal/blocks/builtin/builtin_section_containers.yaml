id: builtin_section_containers
displayName: Section Containers
category: "Control"
implementations:
  - runtime: "arduino:cpp"
    blocks:
      # --- Includes: code injected before global declarations ---
      # C++: #include / #define zone. Python: import zone.
      - blockly:
          type: section_includes
          message0: "Includes %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "C++: code goes to the #include zone (before global declarations)."
        generator: SectionIncludesGenerator

      # --- Global declarations: code at global / module scope ---
      # C++: before setup(). Python: module-level after imports.
      - blockly:
          type: section_declarations
          message0: "Global declarations %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "C++: code at global scope (after includes, before setup)."
        generator: SectionDeclarationsGenerator

      # --- Setup: code that runs once at startup ---
      # C++: inside void setup(). Python: module-level before def loop().
      - blockly:
          type: section_setup
          message0: "Setup %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "C++: code runs inside void setup()."
        generator: SectionSetupGenerator

      # --- Helper functions: reusable function definitions ---
      # C++: function definitions at global scope (before setup). Python: def blocks at module level.
      - blockly:
          type: section_helpers
          message0: "Helper functions %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "C++: function definitions at global scope (before setup)."
        generator: SectionHelpersGenerator

  - runtime: "arduino:python"
    blocks:
      - blockly:
          type: section_includes
          message0: "Includes %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "Python: code that imports packages used in the program (before global declarations)."
        generator: SectionIncludesGenerator

      - blockly:
          type: section_declarations
          message0: "Global declarations %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "Python: module-level code after imports."
        generator: SectionDeclarationsGenerator

      - blockly:
          type: section_setup
          message0: "Setup %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "Python: code runs at module level before def loop()."
        generator: SectionSetupGenerator

      - blockly:
          type: section_helpers
          message0: "Helper functions %1"
          args0:
            - type: input_statement
              name: BODY
          previousStatement: null
          nextStatement: null
          tooltip: "Python: def blocks at module level."
        generator: SectionHelpersGenerator
