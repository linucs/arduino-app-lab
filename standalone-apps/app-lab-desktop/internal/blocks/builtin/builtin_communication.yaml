id: builtin_communication
category: "Messaging"
docs:
  library: "https://docs.arduino.cc/libraries/bridge/"
  api: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
implementations:
  - runtime: "arduino:cpp"
    codegen:
      imports:
        - "#include <Arduino_RouterBridge.h>"
    blocks:
      # --- Monitor.println (cpp_print — iteration 3 name preserved) ---
      - blockly:
          type: cpp_print
          message0: "Monitor.println %1"
          args0:
            - type: input_value
              name: VALUE
          previousStatement: null
          nextStatement: null
          tooltip: "Print a value to the serial monitor via the Arduino Router Bridge."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
          inputsInline: true
        codegen:
          setup:
            - "Monitor.begin();"
          body:
            - "Monitor.println({{VALUE}});"
          inputDefaults:
            VALUE: '""'

      # --- Bridge.notify (declarative) ---
      - blockly:
          type: cpp_bridge_notify
          message0: "Bridge.notify %1 data %2"
          args0:
            - type: field_input
              name: NAME
              text: "eventName"
            - type: input_value
              name: ARGS
          previousStatement: null
          nextStatement: null
          tooltip: "Send a notification event to the SBC side via the Bridge."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
          inputsInline: true
        codegen:
          setup:
            - "Bridge.begin();"
          body:
            - "Bridge.notify(\"{{NAME}}\", {{ARGS}});"
          inputDefaults:
            ARGS: "nullptr"

      # --- Bridge.provide (declarative — callback function via declarations) ---
      # declarations are content-hashed: two provide blocks with different
      # NAME values produce separate handler functions.
      - blockly:
          type: cpp_bridge_provide
          message0: "Bridge.provide %1"
          args0:
            - type: field_input
              name: NAME
              text: "serviceName"
          message1: "do %1"
          args1:
            - type: input_statement
              name: BODY
          nextStatement: null
          tooltip: "Register a handler for a Bridge service call from the SBC side."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
        codegen:
          declarations:
            - "String _bridgeHandler_{{NAME}}(String args) {\n{{BODY}}\n  return \"\";\n}"
          setup:
            - "Bridge.begin();"
            - "Bridge.provide(\"{{NAME}}\", _bridgeHandler_{{NAME}});"

      # --- Bridge.call (declarative) ---
      - blockly:
          type: cpp_bridge_call
          message0: "Bridge.call %1 args %2 into %3 %4"
          args0:
            - type: field_input
              name: NAME
              text: "serviceName"
            - type: input_value
              name: ARGS
            - type: field_dropdown
              name: TYPE
              options:
                - ["String", "String"]
                - ["int", "int"]
                - ["float", "float"]
                - ["double", "double"]
                - ["bool", "bool"]
            - type: field_input
              name: OUT_VAR
              text: "result"
          previousStatement: null
          nextStatement: null
          tooltip: "Call a Bridge service on the SBC and capture the result into a typed variable."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
          inputsInline: true
        codegen:
          declarations:
            - "{{TYPE}} {{OUT_VAR}};"
          setup:
            - "Bridge.begin();"
          body:
            - "Bridge.call(\"{{NAME}}\", {{ARGS}}).result({{OUT_VAR}});"
          inputDefaults:
            ARGS: "nullptr"

  - runtime: "arduino:python"
    codegen:
      imports:
        - "from arduino.app_utils import Bridge"
    blocks:
      # --- Bridge.notify (Python, declarative) ---
      - blockly:
          type: python_bridge_notify
          message0: "Bridge.notify %1 data %2"
          args0:
            - type: field_input
              name: NAME
              text: "eventName"
            - type: input_value
              name: ARGS
          previousStatement: null
          nextStatement: null
          tooltip: "Send a notification event to the MCU side via the Bridge."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
          inputsInline: true
        codegen:
          body:
            - "Bridge.notify(\"{{NAME}}\", {{ARGS}})"
          inputDefaults:
            ARGS: "None"

      # --- Bridge.provide (Python, declarative — callback via declarations) ---
      # declarations are content-hashed: two provide blocks with different
      # NAME values produce separate handler functions.
      - blockly:
          type: python_bridge_provide
          message0: "Bridge.provide %1"
          args0:
            - type: field_input
              name: NAME
              text: "serviceName"
          message1: "do %1"
          args1:
            - type: input_statement
              name: BODY
          nextStatement: null
          tooltip: "Register a handler for a Bridge service call from the MCU side."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
        codegen:
          declarations:
            - "def _bridge_handler_{{NAME}}(args):\n{{BODY}}"
          setup:
            - "Bridge.provide(\"{{NAME}}\", _bridge_handler_{{NAME}})"

      # --- Bridge.call (Python, declarative — value block) ---
      - blockly:
          type: python_bridge_call
          message0: "Bridge.call %1 args %2"
          args0:
            - type: field_input
              name: NAME
              text: "serviceName"
            - type: input_value
              name: ARGS
          output: null
          tooltip: "Call a Bridge service on the MCU and return the result."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
          inputsInline: true
        codegen:
          body:
            - "Bridge.call(\"{{NAME}}\", {{ARGS}})"
          precedence: ATOMIC
          inputDefaults:
            ARGS: "None"

      # --- Logger create (setup: creates a named Logger instance) ---
      - blockly:
          type: python_logger_create
          message0: "Logger %1 named %2"
          args0:
            - type: field_input
              name: VAR_NAME
              text: "logger"
            - type: field_input
              name: LABEL
              text: "app"
          previousStatement: null
          nextStatement: null
          tooltip: "Create a Logger instance. Place near the top of the workspace."
          helpUrl: "https://docs.arduino.cc/software/app-lab/bridge/bridge-api/"
        codegen:
          imports:
            - "from arduino.app_utils import Logger"
          declarations:
            - "{{VAR_NAME}} = Logger('{{LABEL}}')"

      # --- Logger log ---
      - blockly:
          type: python_logger_log
          message0: "%1 . %2 %3"
          args0:
            - type: input_value
              name: LOGGER
            - type: field_dropdown
              name: LEVEL
              options:
                - ["info", "info"]
                - ["debug", "debug"]
                - ["warning", "warning"]
            - type: input_value
              name: MESSAGE
          previousStatement: null
          nextStatement: null
          tooltip: "Log a message at the given level."
          inputsInline: true
        codegen:
          body:
            - "{{LOGGER}}.{{LEVEL}}({{MESSAGE}})"
          inputDefaults:
            LOGGER: "logger"
            MESSAGE: '""'
