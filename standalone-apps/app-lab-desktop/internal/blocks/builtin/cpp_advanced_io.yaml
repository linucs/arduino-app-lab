id: builtin_advanced_io
category: "Input / Output::Advanced"
implementations:
  - runtime: "arduino:cpp"
    blocks:
      # --- tone ---
      - blockly:
          type: cpp_tone
          message0: "tone pin %1 frequency %2 duration %3"
          args0:
            - type: input_value
              name: PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: input_value
              name: FREQUENCY
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: input_value
              name: DURATION
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Generate a square wave of the specified frequency on a pin."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/advanced-io/tone/"
          inputsInline: true
        codegen:
          body:
            - "tone({{PIN}}, {{FREQUENCY}}, {{DURATION}});"
          inputDefaults:
            PIN: "8"
            FREQUENCY: "440"
            DURATION: "500"

      # --- noTone ---
      - blockly:
          type: cpp_no_tone
          message0: "noTone pin %1"
          args0:
            - type: input_value
              name: PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Stop generating a square wave on a pin."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/advanced-io/notone/"
          inputsInline: true
        codegen:
          body:
            - "noTone({{PIN}});"
          inputDefaults:
            PIN: "8"

      # --- pulseIn ---
      - blockly:
          type: cpp_pulse_in
          message0: "pulseIn pin %1 %2 timeout %3 µs"
          args0:
            - type: input_value
              name: PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: field_dropdown
              name: VALUE
              options:
                - ["HIGH", "HIGH"]
                - ["LOW", "LOW"]
            - type: input_value
              name: TIMEOUT
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          output: Number
          tooltip: "Measure the duration of a pulse on a pin in microseconds."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/advanced-io/pulsein/"
          inputsInline: true
        codegen:
          body:
            - "pulseIn({{PIN}}, {{VALUE}}, {{TIMEOUT}})"
          precedence: ATOMIC
          inputDefaults:
            PIN: "2"
            TIMEOUT: "1000000"

      # --- pulseInLong ---
      - blockly:
          type: cpp_pulse_in_long
          message0: "pulseInLong pin %1 %2 timeout %3 µs"
          args0:
            - type: input_value
              name: PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: field_dropdown
              name: VALUE
              options:
                - ["HIGH", "HIGH"]
                - ["LOW", "LOW"]
            - type: input_value
              name: TIMEOUT
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          output: Number
          tooltip: "Like pulseIn but uses micros() internally — better for longer pulses."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/advanced-io/pulseinlong/"
          inputsInline: true
        codegen:
          body:
            - "pulseInLong({{PIN}}, {{VALUE}}, {{TIMEOUT}})"
          precedence: ATOMIC
          inputDefaults:
            PIN: "2"
            TIMEOUT: "1000000"

      # --- shiftOut ---
      - blockly:
          type: cpp_shift_out
          message0: "shiftOut data %1 clock %2 %3 value %4"
          args0:
            - type: input_value
              name: DATA_PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: input_value
              name: CLOCK_PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: field_dropdown
              name: BIT_ORDER
              options:
                - ["MSBFIRST", "MSBFIRST"]
                - ["LSBFIRST", "LSBFIRST"]
            - type: input_value
              name: VALUE
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Shift out a byte of data bit by bit."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/advanced-io/shiftout/"
          inputsInline: true
        codegen:
          body:
            - "shiftOut({{DATA_PIN}}, {{CLOCK_PIN}}, {{BIT_ORDER}}, {{VALUE}});"
          inputDefaults:
            DATA_PIN: "11"
            CLOCK_PIN: "13"
            VALUE: "0"

      # --- shiftIn ---
      - blockly:
          type: cpp_shift_in
          message0: "shiftIn data %1 clock %2 %3"
          args0:
            - type: input_value
              name: DATA_PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: input_value
              name: CLOCK_PIN
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte", "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: field_dropdown
              name: BIT_ORDER
              options:
                - ["MSBFIRST", "MSBFIRST"]
                - ["LSBFIRST", "LSBFIRST"]
          output: Number
          tooltip: "Shift in a byte of data bit by bit."
          helpUrl: "https://www.arduino.cc/reference/en/language/functions/advanced-io/shiftin/"
          inputsInline: true
        codegen:
          body:
            - "shiftIn({{DATA_PIN}}, {{CLOCK_PIN}}, {{BIT_ORDER}})"
          precedence: ATOMIC
          inputDefaults:
            DATA_PIN: "11"
            CLOCK_PIN: "13"
